[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "together-ai-open-model-fidelity-passport"
version = "1.1.0"
description = "Machine-verifiable model lineage, fidelity, compatibility, and serving economics passport"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
open-model-fidelity-passport = "open_model_fidelity_cli:main"

[tool.setuptools]
py-modules = ["open_model_fidelity_passport", "open_model_fidelity_cli", "runtime_receipt_adapter", "promotion_authority"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
